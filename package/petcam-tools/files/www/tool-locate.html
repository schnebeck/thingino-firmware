<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>thingino · Locate</title>
  <script src="/a/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/a/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/a/main.css">
</head>

<body id="page-tool-locate">
<nav data-app-nav></nav>

<main class="pb-4">
  <div class="container" style="min-height:80vh">
    <div data-app-controls></div>

    <section>
      <div class="card mb-3">
        <div class="card-header">
          <h2 class="card-title mb-0">Approximate Location</h2>
        </div>
        <div class="card-body">
          <p class="text-secondary">
            Estimated from nearby WiFi networks (server-assisted over the VPN -
            the camera never contacts the internet directly for this). City-block
            accuracy at best, not precise positioning.
          </p>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="locate-enabled">
            <label class="form-check-label" for="locate-enabled">Enable WiFi-based location</label>
          </div>
          <p id="locate-status" class="text-secondary">Not yet located.</p>
          <p id="locate-result" class="d-none">
            <a id="locate-map-link" href="#" target="_blank" rel="noopener">
              <i class="bi bi-geo-alt-fill"></i> <span id="locate-coords"></span>
            </a>
            <br>
            <small class="text-secondary">
              Accuracy: ~<span id="locate-accuracy"></span> m
              &middot; Updated: <span id="locate-updated"></span>
            </small>
          </p>
          <button type="button" class="btn btn-primary" id="locate-btn">
            <i class="bi bi-crosshair"></i> Locate now
          </button>
        </div>
      </div>
    </section>
  </div>
</main>

<footer data-app-footer></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/a/main.js"></script>
<script src="/a/navigation.js"></script>
<script src="/a/footer.js"></script>
<script src="/a/control-bar.js"></script>
<script src="/a/tool-locate.js"></script>
</body>
</html>
