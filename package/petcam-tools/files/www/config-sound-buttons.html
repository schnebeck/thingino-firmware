<body id="page-config-sound-buttons">
<nav data-app-nav></nav>

<main class="pb-4">
  <div class="container" style="min-height:80vh">
    <div data-app-controls></div>

    <section>
      <h2 class="mb-3">Sound Buttons</h2>
      <p class="text-secondary mb-4">Up to 5 quick-play sounds through the camera speaker, reachable from the "Sounds" button in the control bar. Upload a sound file (WAV, MP3, AAC/M4A or Opus/OGG - no conversion happens on the camera, so upload whatever quality you want played back) and assign it to a slot below.</p>

      <div id="sb-alerts"></div>

      <div id="sb-slots"></div>

      <button type="button" class="btn btn-primary" id="save_all">
        <i class="bi bi-check-circle"></i> Save Settings
      </button>
    </section>
  </div>
</main>

<footer data-app-footer></footer>
