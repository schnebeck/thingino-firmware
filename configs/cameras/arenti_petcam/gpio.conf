# PetCam-specific GPIO defaults, applied on top of the generic gpio.conf by S05gpio.
#
# GPIO 57 (PB25) is the DC-motor (treat dispenser) enable line, active-low.
# Left unclaimed/floating it gets pulled toward an active state by the motor
# driver circuit (no hardware pull-up on this board), spinning the motor
# continuously from power-on. Must be driven high (off) explicitly at boot.
57 high

# Ruehrwerk (agitator) stepper coil pins (46/40/10/11). Same driver-circuit
# issue as GPIO 57: floating pins get pulled toward an energized state, so a
# winding can sit under continuous current from power-on until something
# explicitly drives it low - stepper.c only de-energizes after it has run at
# least once, which does not cover the window before that. Must be driven
# low (de-energized) explicitly at boot, independent of stepper.c.
46 low
40 low
10 low
11 low
